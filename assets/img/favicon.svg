  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#rim)" stroke-width="1"></circle>

  
  <ellipse cx="24" cy="22" rx="4.5" ry="3" fill="#ffffff" opacity="0.55"></ellipse>
  <ellipse cx="22.5" cy="20.5" rx="2" ry="1.2" fill="#ffffff" opacity="0.9"></ellipse>
