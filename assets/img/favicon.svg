<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    
    <radialGradient id="base" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1a3d"></stop>
      <stop offset="80%" stop-color="#0a1430"></stop>
      <stop offset="100%" stop-color="#070d22"></stop>
    </radialGradient>
    
    <radialGradient id="aqua" cx="35%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#b8f0f3" stop-opacity="0.95"></stop>
      <stop offset="35%" stop-color="#7dd3da" stop-opacity="0.65"></stop>
      <stop offset="70%" stop-color="#7dd3da" stop-opacity="0.15"></stop>
      <stop offset="100%" stop-color="#7dd3da" stop-opacity="0"></stop>
    </radialGradient>
    
    <radialGradient id="peri" cx="65%" cy="68%" r="38%">
      <stop offset="0%" stop-color="#9caee0" stop-opacity="0.75"></stop>
      <stop offset="60%" stop-color="#7589c4" stop-opacity="0.2"></stop>
      <stop offset="100%" stop-color="#7589c4" stop-opacity="0"></stop>
