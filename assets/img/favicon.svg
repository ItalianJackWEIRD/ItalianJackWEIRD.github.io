  <circle cx="32" cy="32" r="30" fill="url(#halo)"></circle>

  
  <circle cx="32" cy="32" r="24" fill="url(#base)"></circle>

  
  <circle cx="32" cy="32" r="24" fill="url(#peri)"></circle>
